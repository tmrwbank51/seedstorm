<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEEDSTORM — turn-based ant artillery</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a2410;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #8ec9e8;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
    cursor: crosshair;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script src="src/rng.js"></script>
<script src="src/audio.js"></script>
<script src="src/particles.js"></script>
<script src="src/terrain.js"></script>
<script src="src/ants.js"></script>
<script src="src/weapons.js"></script>
<script src="src/ai.js"></script>
<script src="src/levels.js"></script>
<script src="src/game.js"></script>
</body>
</html>
